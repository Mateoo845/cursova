<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий Клікер</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .score-box {
            font-size: 2rem;
            color: #4cd137;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #click-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            background-color: #0097e6;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0,151,230,0.4);
        }

        #click-btn:hidden {
            outline: none;
        }

        #click-btn:active {
            transform: scale(0.95);
            background-color: #00a8ff;
        }

        .upgrade-section {
            margin-top: 25px;
            border-top: 1px solid #444;
            padding-top: 15px;
        }

        #upgrade-btn {
            padding: 10px 20px;
            background-color: #e1b12c;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #upgrade-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Клікер</h1>
        <div class="score-box">Монети: <span id="score">0</span></div>
        
        <button id="click-btn">КЛІК!</button>

        <div class="upgrade-section">
            <p>Сила кліку: +<span id="click-power">1</span></p>
            <button id="upgrade-btn">Покращення (Ціна: 10)</button>
        </div>
    </div>

    <script>
        // Ініціалізація змінних гри
        let score = 0;
        let clickPower = 1;
        let upgradeCost = 10;

        // Пошук елементів на сторінці
        const scoreElement = document.getElementById('score');
        const clickButton = document.getElementById('click-btn');
        const upgradeButton = document.getElementById('upgrade-btn');
        const clickPowerElement = document.getElementById('click-power');

        // Функція оновлення інтерфейсу
        function updateDisplay() {
            scoreElement.textContent = score;
            clickPowerElement.textContent = clickPower;
            upgradeButton.textContent = `Покращення (Ціна: ${upgradeCost})`;
            
            // Активувати або деактивувати кнопку покращення
            if (score >= upgradeCost) {
                upgradeButton.disabled = false;
            } else {
                upgradeButton.disabled = true;
            }
        }

        // Обробка головного кліку
        clickButton.addEventListener('click', () => {
            score += clickPower;
            updateDisplay();
        });

        // Обробка покупки покращення
        upgradeButton.addEventListener('click', () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                clickPower += 1;
                upgradeCost = Math.round(upgradeCost * 1.5); // Ціна зростає на 50%
                updateDisplay();
            }
        });

        // Перший запуск для перевірки стану кнопки покращення
        updateDisplay();
    </script>
